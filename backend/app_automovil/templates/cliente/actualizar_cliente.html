{% extends 'base.html' %}
{% block titulo %}Actualizar Cliente{% endblock %}

{% block contenido %}
<div class="container">
    <h2 class="mb-4"><i class="bi bi-pencil"></i> Actualizar Cliente</h2>
    
    <form method="post" class="bg-light p-4 rounded shadow">
        {% csrf_token %}
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" name="nombre" 
                       value="{{ cliente.nombre }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Apellido</label>
                <input type="text" class="form-control" name="apellido" 
                       value="{{ cliente.apellido }}" required>
            </div>
        </div>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Teléfono</label>
                <input type="tel" class="form-control" name="telefono" 
                       value="{{ cliente.telefono }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" 
                       value="{{ cliente.email }}" required>
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Dirección</label>
            <input type="text" class="form-control" name="direccion_cliente" 
                   value="{{ cliente.direccion_cliente }}" required>
        </div>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">DNI</label>
                <input type="text" class="form-control" name="dni" 
                       value="{{ cliente.dni }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Preferencia de Contacto</label>
                <select class="form-select" name="preferencia_contacto">
                    <option value="Teléfono" {% if cliente.preferencia_contacto == "Teléfono" %}selected{% endif %}>Teléfono</option>
                    <option value="Email" {% if cliente.preferencia_contacto == "Email" %}selected{% endif %}>Email</option>
                    <option value="WhatsApp" {% if cliente.preferencia_contacto == "WhatsApp" %}selected{% endif %}>WhatsApp</option>
                </select>
            </div>
        </div>
        
        <div class="mt-4">
            <button type="submit" class="btn btn-warning">
                <i class="bi bi-arrow-clockwise"></i> Actualizar
            </button>
            <a href="{% url 'app_automovil:inicio_clientes' %}" class="btn btn-secondary">
                <i class="bi bi-x-circle"></i> Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
