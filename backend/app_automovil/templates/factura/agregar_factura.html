{% extends 'base.html' %}
{% block titulo %}Agregar Factura{% endblock %}

{% block contenido %}
<div class="container">
    <h2 class="mb-4"><i class="bi bi-receipt"></i> Nueva Factura</h2>
    
    <form method="post" class="bg-light p-4 rounded shadow">
        {% csrf_token %}
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Orden de Reparación</label>
                <select class="form-select" name="id_orden" required>
                    <option value="">Seleccionar orden...</option>
                    {% for orden in ordenes %}
                    <option value="{{ orden.id_orden }}">
                        Orden #{{ orden.id_orden }} - {{ orden.id_vehiculo.marca }} {{ orden.id_vehiculo.modelo }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Cliente</label>
                <select class="form-select" name="id_cliente_factura" required>
                    <option value="">Seleccionar cliente...</option>
                    {% for cliente in clientes %}
                    <option value="{{ cliente.id_cliente }}">
                        {{ cliente.nombre }} {{ cliente.apellido }} - {{ cliente.dni }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Total Factura ($)</label>
                <input type="number" step="0.01" class="form-control" name="total_factura" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Estado de Pago</label>
                <select class="form-select" name="estado_pago" required>
                    <option value="PENDIENTE">Pendiente</option>
                    <option value="PAGADO">Pagado</option>
                    <option value="CANCELADO">Cancelado</option>
                </select>
            </div>
        </div>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Método de Pago</label>
                <select class="form-select" name="metodo_pago" required>
                    <option value="EFECTIVO">Efectivo</option>
                    <option value="TARJETA">Tarjeta</option>
                    <option value="TRANSFERENCIA">Transferencia</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Fecha de Vencimiento</label>
                <input type="date" class="form-control" name="fecha_vencimiento" required>
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">IVA Aplicado (%)</label>
            <input type="number" step="0.01" class="form-control" name="iva_aplicado" value="16.00" required>
        </div>
        
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i> Generar Factura
            </button>
            <a href="{% url 'app_automovil:inicio_facturas' %}" class="btn btn-secondary">
                <i class="bi bi-x-circle"></i> Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
