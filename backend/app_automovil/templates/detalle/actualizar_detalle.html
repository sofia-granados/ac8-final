{% extends 'base.html' %}
{% block titulo %}Actualizar Detalle de Reparación{% endblock %}

{% block contenido %}
<div class="container">
    <h2 class="mb-4"><i class="bi bi-pencil"></i> Actualizar Detalle #{{ detalle.id_detalle_rep }}</h2>
    
    <form method="post" class="bg-light p-4 rounded shadow">
        {% csrf_token %}
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Orden de Reparación</label>
                <select class="form-select" name="id_orden" required>
                    <option value="">Seleccionar orden...</option>
                    {% for orden in ordenes %}
                    <option value="{{ orden.id_orden }}"
                            {% if orden.id_orden == detalle.id_orden.id_orden %}selected{% endif %}>
                        Orden #{{ orden.id_orden }} - {{ orden.id_vehiculo.marca }} {{ orden.id_vehiculo.modelo }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Repuesto</label>
                <select class="form-select" name="id_repuesto" required>
                    <option value="">Seleccionar repuesto...</option>
                    {% for repuesto in repuestos %}
                    <option value="{{ repuesto.id_repuesto }}"
                            {% if repuesto.id_repuesto == detalle.id_repuesto.id_repuesto %}selected{% endif %}>
                        {{ repuesto.nombre_repuesto }} - ${{ repuesto.precio_unitario }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="row mb-3">
            <div class="col-md-4">
                <label class="form-label">Cantidad de Repuesto</label>
                <input type="number" class="form-control" name="cantidad_repuesto" 
                       value="{{ detalle.cantidad_repuesto }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Precio Unitario ($)</label>
                <input type="number" step="0.01" class="form-control" name="precio_repuesto_unitario" 
                       value="{{ detalle.precio_repuesto_unitario }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Horas de Mano de Obra</label>
                <input type="number" step="0.01" class="form-control" name="mano_obra_horas" 
                       value="{{ detalle.mano_obra_horas }}" required>
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Costo por Hora de Mano de Obra ($)</label>
            <input type="number" step="0.01" class="form-control" name="costo_mano_obra_hora" 
                   value="{{ detalle.costo_mano_obra_hora }}" required>
        </div>
        
        <div class="alert alert-info">
            <i class="bi bi-info-circle"></i> El subtotal se calculará automáticamente al guardar.
        </div>
        
        <div class="mt-4">
            <button type="submit" class="btn btn-warning">
                <i class="bi bi-arrow-clockwise"></i> Actualizar Detalle
            </button>
            <a href="{% url 'app_automovil:inicio_detalles' %}" class="btn btn-secondary">
                <i class="bi bi-x-circle"></i> Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
