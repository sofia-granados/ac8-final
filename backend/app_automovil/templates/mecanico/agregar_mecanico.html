{% extends 'base.html' %}
{% block titulo %}Agregar Mecánico{% endblock %}

{% block contenido %}
<div class="container">
    <h2 class="mb-4"><i class="bi bi-person-plus"></i> Agregar Nuevo Mecánico</h2>
    
    <form method="post" class="bg-light p-4 rounded shadow">
        {% csrf_token %}
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" name="nombre" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Apellido</label>
                <input type="text" class="form-control" name="apellido" required>
            </div>
        </div>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Especialidad</label>
                <input type="text" class="form-control" name="especialidad" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Teléfono</label>
                <input type="tel" class="form-control" name="telefono" required>
            </div>
        </div>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Salario ($)</label>
                <input type="number" step="0.01" class="form-control" name="salario" required>
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Certificado</label>
            <input type="text" class="form-control" name="certificado" required>
        </div>
        
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i> Guardar Mecánico
            </button>
            <a href="{% url 'app_automovil:inicio_mecanicos' %}" class="btn btn-secondary">
                <i class="bi bi-x-circle"></i> Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
