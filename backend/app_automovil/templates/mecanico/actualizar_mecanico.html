{% extends 'base.html' %}
{% block titulo %}Actualizar Mecánico{% endblock %}

{% block contenido %}
<div class="container">
    <h2 class="mb-4"><i class="bi bi-pencil"></i> Actualizar Mecánico</h2>
    
    <form method="post" class="bg-light p-4 rounded">
        {% csrf_token %}
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" name="nombre" 
                       value="{{ mecanico.nombre }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Apellido</label>
                <input type="text" class="form-control" name="apellido" 
                       value="{{ mecanico.apellido }}" required>
            </div>
        </div>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Especialidad</label>
                <input type="text" class="form-control" name="especialidad" 
                       value="{{ mecanico.especialidad }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Teléfono</label>
                <input type="tel" class="form-control" name="telefono" 
                       value="{{ mecanico.telefono }}" required>
            </div>
        </div>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" 
                       value="{{ mecanico.email }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Salario</label>
                <input type="number" step="0.01" class="form-control" name="salario" 
                       value="{{ mecanico.salario }}" required>
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Certificado</label>
            <input type="text" class="form-control" name="certificado" 
                   value="{{ mecanico.certificado }}" required>
        </div>
        
        <div class="mt-4">
            <button type="submit" class="btn btn-warning">
                <i class="bi bi-arrow-clockwise"></i> Actualizar
            </button>
            <a href="{% url 'app_automovil:inicio_mecanicos' %}" class="btn btn-secondary">
                <i class="bi bi-x-circle"></i> Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
