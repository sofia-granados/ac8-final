{% extends 'base.html' %}
{% block titulo %}Actualizar Orden de Reparación{% endblock %}

{% block contenido %}
<div class="container">
    <h2 class="mb-4"><i class="bi bi-pencil"></i> Actualizar Orden #{{ orden.id_orden }}</h2>
    
    <form method="post" class="bg-light p-4 rounded shadow">
        {% csrf_token %}
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Vehículo</label>
                <select class="form-select" name="id_vehiculo" required>
                    <option value="">Seleccionar vehículo...</option>
                    {% for vehiculo in vehiculos %}
                    <option value="{{ vehiculo.id_vehiculo }}"
                            {% if vehiculo.id_vehiculo == orden.id_vehiculo.id_vehiculo %}selected{% endif %}>
                        {{ vehiculo.marca }} {{ vehiculo.modelo }} - {{ vehiculo.matricula }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Mecánico Asignado</label>
                <select class="form-select" name="id_mecanico_asignado" required>
                    <option value="">Seleccionar mecánico...</option>
                    {% for mecanico in mecanicos %}
                    <option value="{{ mecanico.id_mecanico }}"
                            {% if mecanico.id_mecanico == orden.id_mecanico_asignado.id_mecanico %}selected{% endif %}>
                        {{ mecanico.nombre }} {{ mecanico.apellido }} - {{ mecanico.especialidad }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Fecha Salida Estimada</label>
                <input type="date" class="form-control" name="fecha_salida_estimada" 
                       value="{{ orden.fecha_salida_estimada|date:'Y-m-d' }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Estado de la Orden</label>
                <select class="form-select" name="estado_orden" required>
                    <option value="PENDIENTE" {% if orden.estado_orden == 'PENDIENTE' %}selected{% endif %}>Pendiente</option>
                    <option value="EN_PROCESO" {% if orden.estado_orden == 'EN_PROCESO' %}selected{% endif %}>En Proceso</option>
                    <option value="COMPLETADO" {% if orden.estado_orden == 'COMPLETADO' %}selected{% endif %}>Completado</option>
                    <option value="CANCELADO" {% if orden.estado_orden == 'CANCELADO' %}selected{% endif %}>Cancelado</option>
                </select>
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Diagnóstico Inicial</label>
            <textarea class="form-control" name="diagnostico_inicial" rows="3" required>{{ orden.diagnostico_inicial }}</textarea>
        </div>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Costo Estimado ($)</label>
                <input type="number" step="0.01" class="form-control" name="costo_estimado" 
                       value="{{ orden.costo_estimado }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Observaciones</label>
                <input type="text" class="form-control" name="observaciones" 
                       value="{{ orden.observaciones }}">
            </div>
        </div>
        
        <div class="mt-4">
            <button type="submit" class="btn btn-warning">
                <i class="bi bi-arrow-clockwise"></i> Actualizar Orden
            </button>
            <a href="{% url 'app_automovil:inicio_ordenes' %}" class="btn btn-secondary">
                <i class="bi bi-x-circle"></i> Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
