{% extends 'base.html' %}
{% block titulo %}Agregar Repuesto{% endblock %}

{% block contenido %}
<div class="container">
    <h2 class="mb-4"><i class="bi bi-gear"></i> Agregar Nuevo Repuesto</h2>
    
    <form method="post" class="bg-light p-4 rounded shadow">
        {% csrf_token %}
        
        <div class="mb-3">
            <label class="form-label">Nombre del Repuesto</label>
            <input type="text" class="form-control" name="nombre_repuesto" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" name="descripcion" rows="3" required></textarea>
        </div>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Precio Unitario ($)</label>
                <input type="number" step="0.01" class="form-control" name="precio_unitario" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Stock</label>
                <input type="number" class="form-control" name="stock" required>
            </div>
        </div>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">ID Proveedor</label>
                <input type="number" class="form-control" name="id_proveedor_repuesto" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Número de Pieza del Fabricante</label>
                <input type="text" class="form-control" name="num_pieza_fabricante" required>
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Compatibilidad con Vehículos</label>
            <textarea class="form-control" name="compatibilidad_vehiculos" rows="2" required></textarea>
        </div>
        
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i> Guardar Repuesto
            </button>
            <a href="{% url 'app_automovil:inicio_repuestos' %}" class="btn btn-secondary">
                <i class="bi bi-x-circle"></i> Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
