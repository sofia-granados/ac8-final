{% extends 'base.html' %}
{% block titulo %}Agregar Cliente{% endblock %}

{% block contenido %}
<div class="container">
    <h2 class="mb-4"><i class="bi bi-person-plus"></i> Agregar Nuevo Cliente</h2>
    
    <form method="post" class="bg-light p-4 rounded shadow">
        {% csrf_token %}
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" name="nombre" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Apellido</label>
                <input type="text" class="form-control" name="apellido" required>
            </div>
        </div>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Teléfono</label>
                <input type="tel" class="form-control" name="telefono" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" required>
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Dirección</label>
            <input type="text" class="form-control" name="direccion_cliente" required>
        </div>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">DNI</label>
                <input type="text" class="form-control" name="dni" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Preferencia de Contacto</label>
                <select class="form-select" name="preferencia_contacto">
                    <option value="Teléfono">Teléfono</option>
                    <option value="Email">Email</option>
                    <option value="WhatsApp">WhatsApp</option>
                </select>
            </div>
        </div>
        
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i> Guardar Cliente
            </button>
            <a href="{% url 'app_automovil:inicio_clientes' %}" class="btn btn-secondary">
                <i class="bi bi-x-circle"></i> Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
